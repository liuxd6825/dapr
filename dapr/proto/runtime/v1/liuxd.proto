message CommandRequest {
  RequestHeaders headers = 100;
  string command = 1;
  map<string, string> options=2;
}

message CommandResponse {
  RequestHeaders headers = 100;
  uint64 status = 1;
  map<string, string> data=2;
  string error = 3;
}