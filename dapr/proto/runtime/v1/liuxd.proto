// GetDomainEventRelations

message GetDomainEventRelationsRequest {
  RequestHeaders headers = 100;
  string comp_name = 1;
  string tenant_id = 2;
  string aggregate_type = 3;
  string filter = 4;
  string sort = 5;
  uint64 pageNum = 6;
  uint64 pageSize = 7;
}

message GetDomainEventRelationsResponse {
  ResponseHeaders headers = 1;
  repeated RelationDto data = 2;
  uint64 total_rows = 3;
  uint64 total_pages = 4;
  uint64 page_num = 5;
  uint64 page_size = 6;
  string filter = 7;
  string sort = 8;
  string error = 9;
  bool is_found = 10;
}


message RelationDto {
  string id = 1;
  string tenant_id = 2;
  string table_name = 3;
  string aggregate_id = 4;
  string aggregate_type = 5;
  bool is_deleted = 6;
  string rel_name = 7 ;  // 关系名
  string rel_value = 8; // 关系值
}

// GetDomainEvents

message GetDomainEventsRequest {
  RequestHeaders headers = 100;
  string comp_name = 1;
  string tenant_id = 2;
  string aggregate_type = 3;
  string filter = 4;
  string sort = 5;
  uint64 page_num = 6;
  uint64 page_size = 7;
  bool is_total_rows = 8;
}

message GetDomainEventsResponse {
  ResponseHeaders headers = 1;
  repeated GetDomainEventsItemDto data = 2;
  uint64 total_rows = 3;
  uint64 total_pages = 4;
  uint64 page_num = 5;
  uint64 page_size = 6;
  string filter = 7;
  string sort = 8;
  string error = 9;
  bool is_found = 10;
}

message GetDomainEventsItemDto {
  string event_id = 1;
  string command_id = 2;
  string event_data = 3;   // json format
  string event_type = 4;
  string event_version = 5;
  google.protobuf.Timestamp  event_time = 6;
  string pubsub_name = 7;
  string topic = 8;
  string metadata = 9;  // json format
}


// Application Log
message WriteAppEventLogRequest{
  RequestHeaders headers = 100;
  string comp_name = 1;
  string tenant_id = 2;
  string id = 3;
  string app_id = 4;

  string class = 5;
  string func = 6;

  string level = 7;
  google.protobuf.Timestamp  time = 8;
  bool status = 9;
  string message = 10;

  string pub_app_id = 11;
  string event_id = 12;
  string command_id = 13;

}

message WriteAppEventLogResponse{
  ResponseHeaders headers = 1;
}

message UpdateAppEventLogRequest {
  RequestHeaders headers = 100;
  string comp_name = 1;
  string tenant_id = 2;
  string id = 3;
  string app_id = 4;
  string class = 5;
  string func = 6;
  string level = 7;
  google.protobuf.Timestamp time = 8;
  bool status = 9;
  string message = 10;
  string pub_app_id = 11;
  string event_id = 12;
  string command_id = 13;
}

message UpdateAppEventLogResponse {
  ResponseHeaders headers = 1;
}



// GetAppEventLogByCommandId

message GetAppEventLogByCommandIdRequest {
  RequestHeaders headers = 100;
  string comp_name = 1;
  string tenant_id = 2;
  string app_id = 3;
  string command_id = 4;
}

message GetAppEventLogByCommandIdResponse {

  message EventLogDto {
    string tenant_id = 1;
    string id = 2;
    string app_id = 3;
    string class = 4;
    string func = 5;
    string level = 6;
    google.protobuf.Timestamp time = 7;
    bool status = 8;
    string message = 9;

    string pub_app_id = 10;
    string event_id = 11;
    string command_id = 12;
  }
  ResponseHeaders headers = 1;
  repeated EventLogDto data = 2;
}


