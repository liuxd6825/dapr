apiVersion: dapr.io/v1alpha1
kind: Configuration
metadata:
  name: daprConfig
spec:
  policies:
    circuitBreakers: # 断路器（CB）策略用于当其他应用程序/服务/组件经历较高的失败率时
      pubsubCB:
        maxRequests: 1  # 在 CB 半开（从故障中恢复）时允许通过的最大请求数。默认为 1。
        interval: 8s    # CB 用于清除其内部计数的周期性时间段。如果设置为 0 秒，则永不清除。默认为 0s。
        timeout: 45s    # 开放状态（直接在故障后）到 CB 切换到半开的时间段。默认为 60s。
        trip: consecutiveFailures > 8
          # 由 CB 评估的 通用表达式语言（CEL） 语句。当语句评估为 true 时，CB 触发并变为打开。
          # 默认为 consecutiveFailures > 5。其他可能的值是 requests 和 totalFailures，
          # 其中 requests 表示电路打开之前的成功或失败调用次数，
          # totalFailures 表示电路打开之前的总失败尝试次数（不一定是连续的）。
        # 示例：requests > 5 和 totalFailures >3。
    timeouts: # 超时是简单的命名持续时间。
      general: 5s
      important: 60s
      largeResponse: 10s
    retries: # 重试是重试配置的命名模板，并在操作的生命周期内实例化。
      pubsubRetry:
        policy: constant
        duration: 5s
        maxRetries: 10
      retryForever:
        policy: exponential
        maxInterval: 15s
        maxRetries: -1 # 无限重试

  tracing:
    samplingRate: "1"
    zipkin:
      endpointAddress: "http://localhost:9411/api/v2/spans"

  nameResolution:  # 注册中心
    component: "nacos"
    configuration:
      selfRegister: true
      server:
        - ip: "127.0.0.1"
          port: 8848
          path: "/nacos"
          scheme: "http"
      client:
        timeoutMs: 10000
        namespaceId: public
        logLevel: "debug"
      selected:
        clusters:
        - DEFAULT
        groupName: DEFAULT_GROUP
        healthyOnly: false
      registration:
        weight: 10 # required,it must be lager than 0
        enable: true # required,the instance can be access or not
        healthy: true # required,the instance is health or not
        clusterName: "DEFAULT"  # optional
        groupName: "DEFAULT_GROUP"   # optional,default:DEFAULT_GROUP
        ephemeral: false    # optional
        metadata:       # optional
